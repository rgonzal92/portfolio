<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Richard Gonzalez · Software Engineer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Software engineer with 3+ years at General Motors building Java, Spring Boot, Angular, and PostgreSQL applications, now building and deploying AI-integrated applications on AWS."
    />
    <meta property="og:title" content="Richard Gonzalez · Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer with 3+ years at General Motors building Java, Spring Boot, Angular, and PostgreSQL applications, now building and deploying AI-integrated applications on AWS."
    />
    <meta property="og:type" content="website" />
    <!-- Crawlers (LinkedIn, Slack) need absolute URLs for the link preview. -->
    <meta property="og:url" content="https://rgonz.dev/" />
    <meta property="og:image" content="https://rgonz.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The top of rgonz.dev: Richard Gonzalez, Software Engineer, open to full-stack and backend roles."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap"
    />
    <!-- Apply the saved theme before Angular boots so there is no flash. Dark is the default. -->
    <script>
      try {
        document.documentElement.classList.toggle(
          'p-dark',
          localStorage.getItem('theme') !== 'light',
        );
      } catch {
        document.documentElement.classList.add('p-dark');
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
